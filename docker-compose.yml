services:
  db:
    image: postgres:16-alpine
    container_name: notecraft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-notecraft}
      POSTGRES_PASSWORD: ${PGPASSWORD:-notecraft_secret_password}
      POSTGRES_DB: ${PGDATABASE:-notecraft}
    volumes:
      - notecraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-notecraft} -d ${PGDATABASE:-notecraft}"]
      interval: 5s
      timeout: 5s
      retries: 10

  notecraft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notecraft-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-https://band-latin-accommodations-highly.trycloudflare.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-50979175871-ns1j567ecs3n0elgn5kj2e4e93b7a7af.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-Ov23li3Icc7dZ5L5s8if}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-cc7c5641090e326d59e8e48d87ed9f5072a86684}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-notecraft}
      PGPASSWORD: ${PGPASSWORD:-notecraft_secret_password}
      PGDATABASE: ${PGDATABASE:-notecraft}
      PGSSL: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6K7Bbv0w6zjQ0kQoBNY6VeNNEWK5DPKSjwb-kCQCZ3jLQ}
    ports:
      - "8080:3000"

volumes:
  notecraft_pgdata: